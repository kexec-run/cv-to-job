name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject private or generated files in the Git index
        run: |
          test -z "$(git ls-files private cv-job.yaml)"
          if git ls-files '*.pdf' | grep -q .; then
            echo "Generated or personal PDFs must not be committed" >&2
            exit 1
          fi
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
  macos-locking:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.15"
      - name: Install locked Python environment
        run: uv sync --frozen --all-groups
      - name: Test real process locking on macOS
        run: uv run pytest -q tests/test_application_locking.py
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.15"
      - name: Install locked Python environment
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Test without TeX
        run: uv run pytest -q -k 'not test_sample_resume_render_is_exactly_one_page'
      - name: Test Gmail wrapper (fake connector only)
        run: node --test tests/gmail-wrapper.test.cjs
      - name: Validate sample workspace
        run: uv run cv-job --config sample/cv-job.yaml validate
      - name: Audit sample workspace
        run: uv run cv-job --config sample/cv-job.yaml audit-workspace
      - name: Install TeX build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libpng-dev libfreetype6-dev libfontconfig1-dev \
            libgraphite2-dev libharfbuzz-dev libicu-dev libssl-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned TeX renderer
        run: cargo install tectonic --version 0.17.0 --locked
      - name: Test TeX rendering
        run: uv run pytest -q tests/test_workflow.py::test_sample_resume_render_is_exactly_one_page
      - name: Render sample TeX
        run: uv run cv-job --config sample/cv-job.yaml render tex --in sample/cv_bases/example.tex --out /tmp/sample-resume.pdf
