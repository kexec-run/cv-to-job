[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-job"
version = "0.1.0"
description = "A local, evidence-aware CV and job application workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7",
  "reportlab>=4,<5",
  "pypdfium2>=4,<6",
]

[project.scripts]
cv-job = "cv_job.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
